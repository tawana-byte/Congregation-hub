<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Congregation Hub</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6f6a">
<style>
:root{--bg:#f5f3ee;--card:#fff;--tx:#1d2a2c;--mu:#6b7678;--bd:#e5e1d6;--ac:#2f6f6a;--ok:#2e7d4f;--no:#b64a3a;--wa:#fbefc9;--s1:#2f7d79;--s2:#c08a1e;--s3:#9a3f52}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111718;--card:#1b2325;--tx:#e8eceb;--mu:#98a7a5;--bd:#2b3638;--ac:#5fb3ab;--wa:#47401f;--s1:#5fb3ab;--s2:#e0b050;--s3:#e0839a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:0 16px 40px}header{padding:20px 0 8px;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}.mu{color:var(--mu);font-size:14px}
nav{display:flex;gap:6px;background:var(--bd);padding:4px;border-radius:12px;margin:10px 0 14px}nav button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--mu)}nav button.on{background:var(--card);color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}.banner{background:var(--wa);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:500}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 4px}.part{display:flex;justify-content:space-between;gap:10px;padding:7px 0 7px 10px;border-left:3px solid var(--c);margin-bottom:4px}.part.me{background:var(--wa);border-radius:0 8px 8px 0}.who{color:var(--mu);font-size:14px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer}button.on.yes{background:var(--ok);color:#fff}button.on.no{background:var(--no);color:#fff}button.pri{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;font-weight:600}button.sm{padding:5px 10px;font-size:14px}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.login{text-align:center;padding-top:9vh}.login .card{text-align:left}.err{color:var(--no);font-size:14px}
</style></head><body><main id="app"></main>
<script type="module">
import{firebaseConfig,VAPID_KEY}from"./firebase-config.js";
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,deleteDoc,updateDoc,collection,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import{getMessaging,getToken}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const SECS={s1:"Treasures from God’s Word",s2:"Apply Yourself to the Field Ministry",s3:"Living as Christians"};
const S={u:null,me:null,users:{},mt:[],av:{},tab:"prog",mode:"in",err:"",dr:null};
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mon=d=>{d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d};
const WK=iso(mon(new Date())),fmt=s=>new Date(s+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"long"});
const nm=id=>id===S.u?.uid?"You":S.users[id]?.name||"—",isAdmin=()=>S.me?.role==="admin";
function login(){const reg=S.mode==="up";$("#app").innerHTML=`<div class="login"><div style="font-size:56px">🕊️</div><h1>Congregation Hub</h1><p class="mu">Sign in to see the program and your assignments.</p><div class="card">
${reg?'<input id="n" placeholder="Full name"><input id="c" placeholder="Congregation code (ask the secretary)">':""}<input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password (6+ characters)">
<div class="err">${esc(S.err)}</div><button class="pri" id="go">${reg?"Create account":"Sign in"}</button>
<p class="mu" style="text-align:center"><a href="#" id="sw">${reg?"I already have an account":"Create an account"}</a>${reg?"":' · <a href="#" id="fg">Forgot password</a>'}</p></div></div>`}
function card(m){let h=`<div class="card"><b>Week of ${fmt(m.id)}</b>${m.id===WK?' <span class="mu">· this week</span>':""}${m.reading?`<div class="mu">📖 ${esc(m.reading)}</div>`:""}`;
 for(const k of["s1","s2","s3"]){const ps=(m.parts||[]).filter(p=>p.sec===k);if(ps.length)h+=`<div class="sec" style="color:var(--${k})">${SECS[k]}</div>`+ps.map(p=>`<div class="part ${p.userId===S.u.uid?"me":""}" style="--c:var(--${k})"><span>${esc(p.title)}</span><span class="who">${esc(nm(p.userId))}</span></div>`).join("")}
 return h+(isAdmin()?`<div class="row" style="margin-top:10px"><button class="sm" data-edit="${m.id}">Edit</button><button class="sm" data-del="${m.id}">Delete</button></div>`:"")+"</div>"}
function render(){if(!S.u)return login();if(!S.me){$("#app").innerHTML='<p class="mu">Loading…</p>';return}
 const mine=[];S.mt.filter(m=>m.id===WK).forEach(m=>(m.parts||[]).forEach(p=>p.userId===S.u.uid&&mine.push(p.title)));
 let h=`<header><div><h1>🕊️ Congregation Hub</h1><div class="mu">Hello, ${esc(S.me.name)}</div></div><button class="sm" id="out">Sign out</button></header>
 <nav>${[["prog","Program"],["av","Availability"],...(isAdmin()?[["mg","Manage"]]:[])].map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?"on":""}">${l}</button>`).join("")}</nav>`;
 if(mine.length)h+=`<div class="banner">${new Date().getDay()===1?"📣 Monday reminder: ":"📌 This week: "}you have ${mine.map(esc).join(", ")}</div>`;
 if(S.tab==="prog"){const up=S.mt.filter(m=>m.id>=WK).sort((a,b)=>a.id.localeCompare(b.id));h+=(up.length?up.map(card).join(""):'<p class="mu" style="text-align:center">No program yet.</p>')+'<button id="push" class="sm">🔔 Enable phone reminders</button>'}
 if(S.tab==="av"){const my=S.av[S.u.uid]||{};h+=`<div class="card"><b>Are you available?</b><div class="row" style="margin:10px 0"><button class="yes ${my.status==="yes"?"on":""}" data-av="yes">✓ Available</button><button class="no ${my.status==="no"?"on":""}" data-av="no">✗ Not available</button></div><input id="note" placeholder="Note" value="${esc(my.note||"")}"></div>`;
  if(isAdmin())h+="<h3>Everyone</h3>"+Object.entries(S.av).map(([id,v])=>`<div class="card row"><b>${esc(nm(id))}</b> ${v.status==="yes"?"✓":"✗"} <span class="mu">${esc(v.note||"")}</span></div>`).join("")}
 if(S.tab==="mg"&&isAdmin()){const d=S.dr||(S.dr={week:WK,reading:"",parts:[]}),opts=Object.entries(S.users).map(([id,u])=>`<option value="${id}">${esc(u.name)}</option>`).join("");
  h+=`<div class="card"><b>Meeting workbook</b><input id="dw" type="date" value="${d.week}"><input id="dr" placeholder="Bible reading" value="${esc(d.reading)}">
  ${d.parts.map((p,i)=>`<div class="part" style="--c:var(--${p.sec})"><span>${esc(p.title)}</span><span class="who">${esc(nm(p.userId))} <button class="sm" data-rm="${i}">✕</button></span></div>`).join("")}
  <h3>Add part</h3><select id="ps">${Object.entries(SECS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><input id="pt" placeholder="Talk title"><select id="pu"><option value="">Assign to…</option>${opts}</select>
  <button id="addp" style="width:100%;margin-bottom:8px">+ Add part</button><button class="pri" id="save">Save meeting</button></div>
  <h3>Publishers</h3>${Object.entries(S.users).map(([id,u])=>`<div class="card row"><b>${esc(u.name)}</b><span class="mu">${u.role}</span>${id!==S.u.uid?`<button class="sm" data-role="${id}" data-r="${u.role==="admin"?"publisher":"admin"}">Make ${u.role==="admin"?"publisher":"admin"}</button>`:""}</div>`).join("")}`}
 $("#app").innerHTML=h}
const err=e=>{S.err=(e.code||e.message||"").replace("auth/","").replace(/-/g," ");render()};
document.addEventListener("click",async e=>{const t=e.target,b=t.closest("button"),D=b?.dataset||{};
 try{if(t.id==="sw"){e.preventDefault();S.mode=S.mode==="in"?"up":"in";S.err="";login()}
 else if(t.id==="fg"){e.preventDefault();const m=$("#e").value;if(m){await sendPasswordResetEmail(auth,m);S.err="Reset email sent."}else S.err="Enter your email first.";login()}
 else if(b?.id==="go"){const em=$("#e").value,pw=$("#p").value;
  if(S.mode==="in")await signInWithEmailAndPassword(auth,em,pw);
  else{const n=$("#n").value.trim();if(!n)throw{message:"Enter your name"};const c=await createUserWithEmailAndPassword(auth,em,pw);
   try{await setDoc(doc(db,"users",c.user.uid),{name:n,role:"publisher",code:$("#c").value.trim()})}catch(x){await c.user.delete();throw{message:"Wrong congregation code"}}}}
 else if(b?.id==="out")signOut(auth);
 else if(D.tab){S.tab=D.tab;render()}
 else if(D.av)await setDoc(doc(db,"availability",S.u.uid),{status:D.av,note:$("#note").value,updatedAt:Date.now()});
 else if(D.del){if(confirm("Delete this week?"))await deleteDoc(doc(db,"meetings",D.del))}
 else if(D.edit){const m=S.mt.find(x=>x.id===D.edit);S.dr={week:m.id,reading:m.reading||"",parts:[...(m.parts||[])]};S.tab="mg";render()}
 else if(D.rm){S.dr.parts.splice(+D.rm,1);render()}
 else if(D.role){await updateDoc(doc(db,"users",D.role),{role:D.r})}
 else if(b?.id==="addp"){const ti=$("#pt").value.trim();if(!ti)return;S.dr.parts.push({sec:$("#ps").value,title:ti,userId:$("#pu").value});render()}
 else if(b?.id==="save"){if(!S.dr.parts.length)return alert("Add at least one part.");await setDoc(doc(db,"meetings",iso(mon(new Date(S.dr.week+"T00:00")))),{reading:S.dr.reading,parts:S.dr.parts});S.dr=null;S.tab="prog";render()}
 else if(b?.id==="push"){if(await Notification.requestPermission()!=="granted")return;const reg=await navigator.serviceWorker.register("firebase-messaging-sw.js");
  const tok=await getToken(getMessaging(app),{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});await updateDoc(doc(db,"users",S.u.uid),{fcmToken:tok});alert("Reminders enabled on this device.")}
 }catch(x){alert(x.message||x.code)}});
document.addEventListener("input",e=>{const i=e.target.id;if(i==="dr")S.dr.reading=e.target.value;if(i==="dw")S.dr.week=e.target.value});
document.addEventListener("change",e=>{if(e.target.id==="note"&&S.av[S.u.uid])updateDoc(doc(db,"availability",S.u.uid),{note:e.target.value})});
let offs=[];onAuthStateChanged(auth,u=>{offs.forEach(f=>f());offs=[];S.u=u;S.me=null;if(u){
 offs.push(onSnapshot(doc(db,"users",u.uid),s=>{S.me=s.data();render()}),
 onSnapshot(collection(db,"users"),s=>{S.users={};s.forEach(d=>S.users[d.id]=d.data());render()}),
 onSnapshot(collection(db,"meetings"),s=>{S.mt=s.docs.map(d=>({id:d.id,...d.data()}));render()}),
 onSnapshot(collection(db,"availability"),s=>{S.av={};s.forEach(d=>S.av[d.id]=d.data());render()}))}render()});
</script></body></html>
